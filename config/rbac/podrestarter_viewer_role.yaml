# This rule is not used by the project pod-restarter-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to resilience.demo.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pod-restarter-operator
    app.kubernetes.io/managed-by: kustomize
  name: podrestarter-viewer-role
rules:
- apiGroups:
  - resilience.demo.com
  resources:
  - podrestarters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resilience.demo.com
  resources:
  - podrestarters/status
  verbs:
  - get
